<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error del Servidor - Plataforma Agrónómica</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/error_500.css') }}">
</head>
<body>
    <div class="container">
        <div class="icon">⚠️</div>
        <div class="code">500</div>
        <h1>Error del Servidor</h1>
        <p class="message">
            Algo salió mal en el servidor. Nuestro equipo ha sido notificado.
        </p>
        
        {% if error %}
        <div class="error-box">
            <p><strong>Detalles:</strong></p>
            <code>{{ error }}</code>
        </div>
        {% endif %}

        <div class="buttons">
            <a href="/" class="btn btn-primary">Ir al Dashboard</a>
            <a href="javascript:history.back()" class="btn btn-secondary">Volver Atrás</a>
        </div>
    </div>
</body>
</html>
