{% extends "dashboard_main.html" %}

{% block title %}Gestión de Planes{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/planes.css') }}">
{% endblock %}

{% block content %}
<div class="container">
  <h2>Gestión de Planes</h2>
  <div class="admin-actions">
    <button id="btnAgregarPlan" class="btn btn-primary">Agregar Plan</button>
  </div>

  <table class="table table-striped" id="tablaPlanes">
    <thead>
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Slot</th>
        <th>Inicio</th>
        <th>Fin</th>
        <th>Estado</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <div id="modalPlan" class="modal">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Agregar / Editar Plan</h5>
          <button id="cerrarModalPlan" class="close">×</button>
        </div>
        <div class="modal-body">
          <form id="formPlan">
            <input type="hidden" id="plan_id" />
            <div class="form-group">
              <label>Nombre</label>
              <input class="form-control" id="nombre" required />
            </div>
            <div class="form-group">
              <label>Slot ID</label>
              <input class="form-control" id="slot_id" type="number" />
            </div>
            <div class="form-group">
              <label>Fecha Inicio</label>
              <input class="form-control" id="fecha_inicio" type="date" />
            </div>
            <div class="form-group">
              <label>Fecha Fin</label>
              <input class="form-control" id="fecha_fin" type="date" />
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button id="guardarPlan" class="btn btn-primary">Guardar</button>
          <button id="cancelarModalPlan" class="btn btn-secondary">Cancelar</button>
        </div>
      </div>
    </div>
  </div>

</div>

{% endblock %}

{% block extra_js %}
<script src="/static/js/admin_planes.js"></script>
{% endblock %}
