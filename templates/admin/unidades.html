{% extends 'dashboard_main.html' %}

{% block title %}Unidades detectadas{% endblock %}

{% block content %}
<div class="container">
  <h2>Unidades detectadas</h2>
  <div>
    <label for="slotSelect">Slot:</label>
    <select id="slotSelect"></select>
    <button id="cargarBtn">Cargar unidades</button>
  </div>
  <div style="margin-top:10px;">
    <input type="file" id="uploadInput" accept=".csv" />
    <button id="uploadBtn">Subir mapeo CSV</button>
    <button id="bulkVincularBtn">Vincular seleccionadas</button>
    <small style="display:block;color:#666;margin-top:6px">CSV esperado: unidad_id,tractor_id (con o sin encabezado)</small>
  </div>
  <table id="unidadesTable" class="table">
    <thead>
      <tr>
        <th></th>
        <th>Unidad ID</th>
        <th>Lat</th>
        <th>Lng</th>
        <th>Vel (km/h)</th>
        <th>Batería</th>
        <th>Última</th>
        <th>Tractor vinculado</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>
<script src="/static/js/admin_unidades.js"></script>
{% endblock %}
