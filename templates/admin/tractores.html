{% extends "dashboard_main.html" %}
{% block content %}
<div class="container">
  <h2>Gestión de Tractores</h2>
  <div style="margin-bottom:10px;">
    <button id="btnAgregarTractor" class="btn btn-primary">Agregar Tractor</button>
  </div>

  <table class="table table-striped" id="tablaTractores">
    <thead>
      <tr>
        <th>ID</th>
        <th>Placa</th>
        <th>Modelo</th>
        <th>Año</th>
        <th>Estado</th>
        <th>Slot</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <!-- Modal simple -->
  <div id="modalTractor" class="modal" tabindex="-1" role="dialog" style="display:none;">
    <div class="modal-dialog" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Agregar / Editar Tractor</h5>
          <button type="button" class="close" id="cerrarModal">×</button>
        </div>
        <div class="modal-body">
          <form id="formTractor">
            <input type="hidden" id="tractor_id" />
            <div class="form-group">
              <label>Placa</label>
              <input class="form-control" id="placa" required />
            </div>
            <div class="form-group">
              <label>Modelo</label>
              <input class="form-control" id="modelo" />
            </div>
            <div class="form-group">
              <label>Año</label>
              <input class="form-control" id="ano" type="number" />
            </div>
            <div class="form-group">
              <label>Slot ID (opcional)</label>
              <input class="form-control" id="slot_id" type="number" />
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button id="guardarTractor" class="btn btn-primary">Guardar</button>
          <button id="cancelarModal" class="btn btn-secondary">Cancelar</button>
        </div>
      </div>
    </div>
  </div>

</div>

<link rel="stylesheet" href="/static/css/admin_tractores.css">
<script src="/static/js/admin_tractores.js"></script>
{% endblock %}
