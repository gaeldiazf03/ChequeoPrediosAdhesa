<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Adhesa</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/mapa.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/mapa_nuevas.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/frappe-gantt@0.6.1/dist/frappe-gantt.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>
    <nav class="adhesa-navbar">
        <div class="navbar-left">
            <button onclick="volverAlterior()" class="navbar-btn">Volver</button>
            <h2 style="margin: 0; display: inline-block; margin-left: 20px;">Gestion de Adhesa</h2>
        </div>
        <div class="navbar-right">
            <div id="clima-widget" class="clima-widget">
                <div class="clima-principal">
                    <img id="clima-icono" class="clima-icono" src="https://cdn.jsdelivr.net/gh/basmilius/weather-icons/production/fill/all/partly-cloudy-day.svg" alt="Estado del clima" />
                    <span id="temp-display">--C</span>
                </div>
                <span id="lluvia-display">--% lluvia</span>
            </div>
        </div>
    </nav>

    <div class="map-toolbar">
        {% if puede_agregar %}
        <button id="btnCrearLote" onclick="toggleDibujo()" class="map-button map-button-primary">Crear Lote</button>
        {% endif %}

        {% if puede_agregar or puede_editar %}
        <button id="btnGuardarManual" onclick="guardarManual()" class="map-button map-button-info">Guardar Cambios</button>
        <span id="estadoGuardado" class="map-status">Listo</span>
        {% endif %}

        {% if puede_descargar_mapa %}
        <button onclick="descargarReporteExcel(this)" class="map-button map-button-info">Descargar log</button>
        {% endif %}

        <button onclick="descargarReporte(this)" class="map-button map-button-info">Descargar Avances</button>
        {% if puede_descargar_mapa %}
        <button onclick="enviarReportePorCorreo(this)" class="map-button map-button-warning">Enviar por correo</button>
        {% endif %}
        <button onclick="exportarKML()" class="map-button map-button-primary">Exportar a mapa</button>
        <!-- Botones de análisis manual removidos: asignación ocurre automáticamente al guardar/subir KML -->
    </div>

    <section class="map-workbench">
        <div class="map-column">
            <div class="map-canvas-wrap">
                <div id="map" data-slot-id="{{ slot_id }}" data-puede-agregar="{{ puede_agregar|lower }}"
                    data-puede-editar="{{ puede_editar|lower }}" data-es-admin="{{ es_admin|lower }}"
                    data-puede-marcar-tareas="{{ puede_marcar_tareas|lower }}"
                    data-puede-agregar-tareas="{{ puede_agregar_tareas|lower }}" data-usuario-actual="{{ usuario_actual }}"
                    data-usuarios-lista="{{ usuarios_lista_json }}" data-puede-ver-costos="{{ puede_ver_costos|lower }}"
                    data-puede-descargar-mapa="{{ puede_descargar_mapa|lower }}"
                    data-puede-descargar-logs="{{ puede_descargar_logs|lower }}"
                    data-puede-ver-alertas="{{ puede_ver_alertas|lower }}"></div>
            </div>
        </div>

        <div class="calendar-column">
            <div class="calendar-panel">
                <div id="calendar"></div>
                <div id="selected-dates-info" class="selected-dates-info"></div>
                <div id="task-editor" class="task-editor"></div>
            </div>

        </div>

        <div id="tasks-row" class="tasks-row">
            <div class="tasks-panel">
                <div class="parent-row">
                    <label for="parent-select">Predio padre</label>
                    <select id="parent-select">
                        <option value="">(seleccionar)</option>
                    </select>
                </div>

                <div class="tasks-table-wrap">
                    <table id="tasks-table" class="tasks-table">
                        <thead>
                            <tr>
                                <th>Actividad</th>
                                <th>Observaciones</th>
                                <th>Duración</th>
                                <th>Inicio</th>
                                <th>Fechas</th>
                            </tr>
                        </thead>
                        <tbody>
                        </tbody>
                    </table>
                </div>
            </div>
            <div id="sidebar-info" style="display:none;"></div>
        </div>

        <div id="gantt-row" class="gantt-row">
            <div id="gantt-container" style="margin-top:12px;"></div>
        </div>
    </section>



    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
    <script src="https://api.mapbox.com/mapbox.js/plugins/leaflet-omnivore/v0.3.1/leaflet-omnivore.min.js"></script>
    <script src="https://unpkg.com/@turf/turf@6.5.0/turf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/frappe-gantt@0.6.1/dist/frappe-gantt.umd.js"></script>

    <script src="{{ url_for('static', filename='js/mapa.js') }}"></script>
    <script src="{{ url_for('static', filename='js/mapa_autoguardado.js') }}"></script>
    <script src="{{ url_for('static', filename='js/mapa_vigilancia.js') }}"></script>
    <script src="{{ url_for('static', filename='js/calendario_gantt.js') }}"></script>

</body>

</html>
